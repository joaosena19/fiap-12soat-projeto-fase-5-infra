name: Destruir Infraestrutura AWS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar a destruição de todos os recursos'
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  destroy:
    name: Destruir Infraestrutura
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_tfstate_bucket_name: ${{ secrets.TF_VAR_TFSTATE_BUCKET_NAME }}
      TF_VAR_eks_iam_user_name: ${{ secrets.TF_VAR_EKS_IAM_USER_NAME }}
      TF_VAR_eks_cluster_name: ${{ secrets.TF_VAR_EKS_CLUSTER_NAME }}
      TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "❌ Confirmação falhou. Você deve digitar 'destroy' para prosseguir."
            exit 1
          fi

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Inicializar Terraform
        working-directory: ./infra
        run: terraform init

      - name: Listar todos os recursos antes do destroy
        working-directory: ./infra
        run: |
          echo "📋 Recursos gerenciados pelo Terraform:"
          terraform state list

      - name: Esvaziar bucket de uploads
        working-directory: ./infra
        run: |
          echo "Esvaziando bucket de uploads..."
          UPLOAD_BUCKET=$(terraform output -raw upload_bucket_name 2>/dev/null || echo "fiap-12soat-fase5-upload-diagramas")
          aws s3 rm "s3://${UPLOAD_BUCKET}" --recursive || true

      - name: Remover bucket tfstate do Terraform state
        working-directory: ./infra
        run: |
          echo "Removendo bucket de tfstate do Terraform state (não deleta da AWS)..."
          terraform state rm aws_s3_bucket.bucket_tfstate || true

      - name: Destruir todos os recursos
        working-directory: ./infra
        run: |
          echo "Destruindo todos os recursos restantes..."
          terraform destroy -auto-approve

      - name: Re-importar bucket tfstate no state
        working-directory: ./infra
        run: |
          echo "Re-importando bucket de tfstate no Terraform state..."
          terraform import aws_s3_bucket.bucket_tfstate ${{ secrets.TF_VAR_TFSTATE_BUCKET_NAME }}

      - name: Verificar recursos restantes
        working-directory: ./infra
        run: |
          echo "📋 Recursos restantes no Terraform state (deve conter apenas o bucket tfstate):"
          terraform state list

      - name: Destruição completa
        run: echo "✅ Infraestrutura AWS destruída com sucesso (bucket S3 de tfstate preservado e re-importado)"
