name: Destruir Infraestrutura AWS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" para confirmar a destruição de todos os recursos'
        required: true

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  destroy:
    name: Destruir Infraestrutura
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_tfstate_bucket_name: ${{ secrets.TF_VAR_TFSTATE_BUCKET_NAME }}
      TF_VAR_eks_iam_user_name: ${{ secrets.TF_VAR_EKS_IAM_USER_NAME }}
      TF_VAR_eks_cluster_name: ${{ secrets.TF_VAR_EKS_CLUSTER_NAME }}
      TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "❌ Confirmação falhou. Você deve digitar 'destroy' para prosseguir."
            exit 1
          fi

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Inicializar Terraform
        working-directory: ./infra
        run: terraform init

      - name: Listar todos os recursos antes do destroy
        working-directory: ./infra
        run: |
          echo "📋 Recursos gerenciados pelo Terraform:"
          terraform state list

      - name: Esvaziar bucket de uploads
        working-directory: ./infra
        shell: bash
        run: |
          set -euo pipefail
          echo "Esvaziando bucket de uploads..."

          # Try to read output; if it fails/empty, fall back to known default.
          UPLOAD_BUCKET="$(terraform output -raw upload_bucket_name 2>/dev/null || true)"
          if [[ -z "${UPLOAD_BUCKET}" ]]; then
            UPLOAD_BUCKET="fiap-12soat-fase5-upload-diagramas"
          fi

          # Basic sanity check (avoid accidentally using Terraform warning text as bucket name)
          if [[ ! "${UPLOAD_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "Invalid upload bucket name resolved: '${UPLOAD_BUCKET}'. Skipping S3 cleanup."
            exit 0
          fi

          aws s3 rm "s3://${UPLOAD_BUCKET}" --recursive || true

      - name: Remover bucket tfstate do Terraform state
        working-directory: ./infra
        run: |
          echo "Removendo bucket de tfstate do Terraform state (não deleta da AWS)..."
          terraform state rm aws_s3_bucket.bucket_tfstate || true

      - name: Remover Helm release do state (evita erro de autenticação no cluster)
        working-directory: ./infra
        shell: bash
        run: |
          # O provider Helm do Terraform usa aws_eks_cluster.eks_cluster.endpoint diretamente,
          # e o IAM user do CI pode não ter acesso ao K8s API. O refresh falha com
          # "the server has asked for the client to provide credentials".
          # Remover do state é seguro porque o cluster EKS será destruído em seguida,
          # o que elimina todos os recursos internos (Helm releases, pods, etc).
          terraform state rm helm_release.newrelic_bundle || true

      - name: Destruir todos os recursos
        working-directory: ./infra
        run: |
          echo "Destruindo todos os recursos restantes..."
          terraform destroy -auto-approve

      - name: Re-importar bucket tfstate no state
        working-directory: ./infra
        run: |
          echo "Re-importando bucket de tfstate no Terraform state..."
          terraform import aws_s3_bucket.bucket_tfstate ${{ secrets.TF_VAR_TFSTATE_BUCKET_NAME }}

      - name: Verificar recursos restantes
        working-directory: ./infra
        run: |
          echo "📋 Recursos restantes no Terraform state (deve conter apenas o bucket tfstate):"
          terraform state list

      - name: Destruição completa
        run: echo "✅ Infraestrutura AWS destruída com sucesso (bucket S3 de tfstate preservado e re-importado)"
